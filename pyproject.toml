[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-demo-analyzer"
version = "0.1.0"
description = "Local-first CS2 demo analysis toolkit with quantitative stats and a real-time 2D replay viewer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wang Keren" }]
keywords = ["cs2", "demo", "analyzer", "replay", "radar-chart"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "demoparser2>=0.42,<0.43",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.9",
    "rich>=13.0",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "starlette>=0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.2",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
# Phase L5: /reports PNG/PDF export (headless chromium print)
reports = [
    "playwright>=1.40",
]

[project.scripts]
csa = "cs_analyzer.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cs_analyzer*"]
exclude = ["tests*", "tutorial*", "enve*", "media*"]

# non-code assets the web app needs at runtime (S: wheels/sdists previously
# shipped without them — Jinja2Templates would crash on a missing dir)
[tool.setuptools.package-data]
"cs_analyzer.web" = ["templates/*.html", "static/**/*"]
"cs_analyzer.maps" = ["data/*.png", "data/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
