{% extends "base.html" %}
{% block title %}{{ action }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ action }}中…</h1>
    <div class="page-meta">任务 <code>{{ job_id }}</code> 正在后台执行，完成后自动跳转。</div>
  </div>
</div>
<div class="card">
  <div class="sub" id="job-status">等待中…</div>
  <div class="progress"><i></i></div>
</div>
{% endblock %}
{% block scripts %}
<script>
window.CSA_JOB_ID = "{{ job_id }}";
const st = document.getElementById('job-status');
pollJob(
  window.CSA_JOB_ID,
  (result) => {
    st.textContent = '完成，跳转中…';
    window.location.href = '/demo/' + result;
  },
  (err) => {
    st.textContent = '任务失败: ' + err;
    st.style.color = 'var(--err)';
  }
);
</script>
{% endblock %}
