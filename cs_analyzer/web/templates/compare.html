{% extends "base.html" %}
{% block title %}大数据对比{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>大数据对比</h1>
    <div class="page-meta">个体 vs 全库大样本基线 · 样本量 ≥5 场参与排名与分位 · 勾选选手叠加生涯雷达</div>
  </div>
</div>
<div class="card" style="padding:8px">
  <div id="rank-table" class="chart-loading" style="min-height:120px"></div>
</div>
<div class="section-header"><h2>雷达叠加</h2>
  <div class="section-actions sub" style="margin:0" id="sel-count">已选 0 名选手</div></div>
<div class="card" style="padding:8px">
  <div id="compare-radar" style="height:460px"></div>
</div>
<div class="section-header"><h2>五排协同</h2>
  <div class="section-actions sub" style="margin:0" id="tp-meta">5E 库协同网络</div></div>
<div class="grid two-col">
  <div class="card" style="padding:8px">
    <div class="sub" style="padding:2px 8px 6px">协同网络 · 助攻+补枪+闪光助攻（双向合计）</div>
    <div id="tp-heatmap" style="height:400px"></div>
  </div>
  <div class="card" style="padding:8px">
    <div class="sub" style="padding:2px 8px 6px">Top 协同连线</div>
    <div id="tp-links"></div>
    <div class="sub" style="padding:8px 8px 4px">五排画像（≥5 场常客）</div>
    <div id="tp-portraits" style="display:flex;flex-direction:column;gap:6px;padding:0 8px 6px"></div>
  </div>
</div>
<div class="card" style="padding:10px 12px" id="tp-contrast"></div>
{% endblock %}
{% block scripts %}
<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/vendor/echarts-theme-csa.js?v={{ static_v }}"></script>
<script src="/static/charts.js?v={{ static_v }}"></script>
<script>
(async function () {
  let payload;
  try {
    const r = await fetch('/api/compare/charts.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    payload = await r.json();
  } catch (e) {
    document.getElementById('rank-table').classList.remove('chart-loading');
    document.getElementById('rank-table').innerHTML =
      '<div class="empty-state"><div class="empty-title">数据加载失败</div></div>';
    return;
  }
  const box = document.getElementById('rank-table');
  box.classList.remove('chart-loading');
  const METRICS = [
    ['rating', 'Rating', (v) => v.toFixed(2)],
    ['kpr', 'KPR', (v) => v.toFixed(2)],
    ['adr', 'ADR', (v) => v.toFixed(1)],
    ['hs', 'HS%', (v) => v.toFixed(1)],
  ];
  const rows = payload.players.map((p, i) => {
    const cells = METRICS.map(([key, , fmt]) => {
      const m = p.ratings[key];
      const pct = m ? Math.round(m.pct * 100) : 0;
      return `<td class="num"><div>${m ? fmt(m.value) : '-'}</div>` +
        `<div class="pct-bar" title="超越全库 ${pct}% 选手"><i style="width:${pct}%"></i></div></td>`;
    }).join('');
    const chk = p.eligible
      ? `<input type="checkbox" class="sel-player" data-idx="${i}">`
      : '<span class="badge no" title="样本不足 5 场">少</span>';
    return `<tr class="${p.eligible ? '' : 'low-sample'}">` +
      `<td>${chk}</td><td>${p.name}</td><td class="num">${p.demo_count}</td>${cells}</tr>`;
  }).join('');
  box.innerHTML = `<table><thead><tr><th></th><th class="sortable">选手</th><th class="sortable num">场次</th>` +
    METRICS.map(([k, label]) => `<th class="sortable num">${label}</th>`).join('') +
    `</tr></thead><tbody>${rows}</tbody></table>`;

  // radar overlay of checked players
  const selected = new Map();
  const chartDom = document.getElementById('compare-radar');
  let chart = null;
  function redraw() {
    document.getElementById('sel-count').textContent = `已选 ${selected.size} 名选手`;
    if (!selected.size) { if (chart) { chart.dispose(); chart = null; } return; }
    const series = [...selected.entries()].map(([idx, p], i) => ({
      name: p.name, value: p.radar, raw: p.raw,
      lineStyle: { width: i === 0 ? 2.5 : 1.4, opacity: i === 0 ? 1 : 0.7 },
      areaStyle: { opacity: i === 0 ? 0.22 : 0.08 },
    }));
    const option = {
      tooltip: { trigger: 'item' },
      legend: { type: 'scroll', bottom: 0, textStyle: { color: '#9aa0b8', fontSize: 11 } },
      radar: {
        indicator: payload.indicators.map((n) => ({ name: n, max: 100 })),
        radius: '60%', center: ['50%', '46%'],
        splitArea: { areaStyle: { color: ['rgba(38,41,66,.25)', 'rgba(38,41,66,.08)'] } },
        axisLine: { lineStyle: { color: '#262942' } },
        splitLine: { lineStyle: { color: '#262942' } },
        axisName: { color: '#9aa0b8', fontSize: 11 },
      },
      series: [{ type: 'radar', symbolSize: 3, data: series }],
    };
    if (chart) chart.setOption(option);
    else chart = echarts.init(chartDom, 'csa'), chart.setOption(option);
  }
  box.addEventListener('change', (e) => {
    const cb = e.target.closest('.sel-player');
    if (!cb) return;
    const idx = Number(cb.dataset.idx);
    if (cb.checked) selected.set(idx, payload.players[idx]);
    else selected.delete(idx);
    redraw();
  });

  // ---- K5: five-stack teamplay (network + contrast + portraits) ----
  (async function () {
    let tp;
    try {
      const r = await fetch('/api/compare/teamplay.json');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      tp = await r.json();
    } catch (e) {
      document.getElementById('tp-meta').textContent = '五排协同数据加载失败';
      return;
    }
    const sv = tp.stack_vs_mixed;
    if (!tp.regulars.length) {
      document.getElementById('tp-meta').textContent =
        '5E 样本不足（需 ' + tp.library.min_regular_demos + ' 场以上常客）';
      return;
    }
    document.getElementById('tp-meta').textContent =
      `5E ${tp.library.five_e_demos} 场 · 常客 ${tp.regulars.length} 人 · ` +
      `五排局 ${sv.stack_matches} / 混野 ${sv.mixed_matches}`;

    // heatmap: symmetric link weights between regulars
    const hm = echarts.init(document.getElementById('tp-heatmap'), 'csa');
    const players = tp.matrix.players;
    const data = [];
    players.forEach((a, i) => players.forEach((b, j) => {
      if (i !== j) data.push([j, i, tp.matrix.values[i][j]]);
    }));
    const maxW = Math.max(1, ...data.map((d) => d[2]));
    hm.setOption({
      tooltip: { formatter: (p) => `${players[p.value[1]]} ↔ ${players[p.value[0]]}: ${p.value[2]}` },
      grid: { left: 110, right: 20, top: 10, bottom: 60 },
      xAxis: { type: 'category', data: players, axisLabel: { color: '#9aa0b8', fontSize: 10, rotate: 40 },
               axisLine: { lineStyle: { color: '#262942' } } },
      yAxis: { type: 'category', data: players, axisLabel: { color: '#9aa0b8', fontSize: 10 },
               axisLine: { lineStyle: { color: '#262942' } } },
      visualMap: { min: 0, max: maxW, calculable: false, orient: 'horizontal',
                   left: 'center', bottom: 0, itemHeight: 80, itemWidth: 12,
                   inRange: { color: ['#26294a', '#8b5cf6'] }, textStyle: { color: '#9aa0b8', fontSize: 10 } },
      series: [{ type: 'heatmap', data,
                 label: { show: true, color: '#eceaf6', fontSize: 9 },
                 itemStyle: { borderColor: '#10111d', borderWidth: 1 } }],
    });

    // top links table
    const links = tp.links.slice(0, 10).map((l) =>
      `<tr><td>${l.a_name} → ${l.b_name}</td>` +
      `<td class="num">${l.assists}</td><td class="num">${l.trades}</td>` +
      `<td class="num">${l.flash_assists}</td><td class="num"><b>${l.weight}</b></td></tr>`).join('');
    document.getElementById('tp-links').innerHTML =
      `<table><thead><tr><th>连线（助攻方 → 被助方 / 复仇者 → 被复仇者）</th>` +
      `<th class="num">助攻</th><th class="num">补枪</th><th class="num">闪助</th><th class="num">权重</th>` +
      `</tr></thead><tbody>${links}</tbody></table>`;

    // portraits
    document.getElementById('tp-portraits').innerHTML = tp.portraits.map((p) => {
      const labels = p.labels.map((x) =>
        `<span class="badge kb-headshot" title="${x.detail}">${x.label}</span>`).join(' ');
      const partner = p.best_partner
        ? ` · 最佳搭档 <b>${p.best_partner.name}</b>(${p.best_partner.weight})` : '';
      return `<div>${p.name} <span class="sub">${p.appearances} 场${partner}</span> ${labels}</div>`;
    }).join('');

    // stack vs mixed contrast tiles
    const tile = (name, s, m) => {
      const f = (v, suf = '') => (v == null ? '-' : (v * 100).toFixed(1) + suf);
      return `<div class="stat-card" style="min-width:200px"><div class="stat-label">${name} 回合胜率</div>` +
        `<div class="stat-value">${f(s.round_win_rate, '%')}</div>` +
        `<div class="sub">混野 ${f(m.round_win_rate, '%')} · 胜率差 ` +
        `${s.round_win_rate != null && m.round_win_rate != null ? ((s.round_win_rate - m.round_win_rate) * 100).toFixed(1) + 'pp' : '-'}</div></div>` +
        `<div class="stat-card" style="min-width:200px"><div class="stat-label">${name} 场均 Rating</div>` +
        `<div class="stat-value">${s.avg_rating ?? '-'}</div>` +
        `<div class="sub">混野 ${m.avg_rating ?? '-'}</div></div>` +
        `<div class="stat-card" style="min-width:200px"><div class="stat-label">${name} 首杀成功率</div>` +
        `<div class="stat-value">${f(s.fk_success, '%')}</div>` +
        `<div class="sub">混野 ${f(m.fk_success, '%')} · ${s.fk_duels} 次对枪</div></div>`;
    };
    document.getElementById('tp-contrast').innerHTML =
      `<div style="display:flex;gap:12px;flex-wrap:wrap">` +
      tile('车队局（≥' + tp.library.stack_threshold + ' 常客同场）', sv.stack, sv.mixed) + `</div>` +
      `<div class="sub" style="margin-top:6px">车队局 ${sv.stack_matches} 场；混野为其余 ` +
      `${sv.mixed_matches} 场 5E（常客不足同场）。Rating 为该组常客样本均值。</div>`;
  })();
})();
</script>
{% endblock %}
