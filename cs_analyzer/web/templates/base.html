<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CsDemoAnalyzer{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topbar">
  <span class="brand">🎯 CsDemoAnalyzer</span>
  {% set p = request.url.path %}
  <a href="/" class="{{ 'active' if p == '/' or not p.startswith(('/aggregate', '/studio', '/coverage')) else '' }}">Demo 分析器</a>
  <a href="/aggregate" class="{{ 'active' if p.startswith('/aggregate') else '' }}">定量·跨场聚合</a>
  <a href="/studio" class="{{ 'active' if p.startswith('/studio') else '' }}">视频导出</a>
  <a href="/coverage" class="{{ 'active' if p.startswith('/coverage') else '' }}">覆盖度</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
