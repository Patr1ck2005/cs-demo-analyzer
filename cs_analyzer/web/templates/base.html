<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CsDemoAnalyzer{% endblock %}</title>
<link rel="stylesheet" href="/static/fonts.css?v={{ static_v }}">
<link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<nav class="topbar">
  <a href="/" class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" stroke="#a78bfa" stroke-width="1.6"/>
      <g class="xhair-spin">
        <path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5" stroke="#c4b5fd" stroke-width="1.6" stroke-linecap="round"/>
      </g>
      <circle cx="12" cy="12" r="2.4" fill="#a78bfa"/>
    </svg>
    CsDemoAnalyzer
  </a>
  {% set nav_path = request.url.path %}
  <nav>
    <a href="/" class="{{ 'active' if nav_path == '/' else '' }}">仪表盘</a>
    <a href="/matches" class="{{ 'active' if nav_path.startswith('/match') or nav_path == '/matches' else '' }}">对局</a>
    <a href="/players" class="{{ 'active' if nav_path.startswith('/player') else '' }}">选手</a>
    <a href="/highlights" class="{{ 'active' if nav_path.startswith('/highlights') else '' }}">高光</a>
    <a href="/compare" class="{{ 'active' if nav_path.startswith('/compare') else '' }}">对比</a>
    <a href="/system" class="{{ 'active' if nav_path.startswith('/system') else '' }}">系统</a>
  </nav>
</nav>
<nav class="nav-secondary">
  <div class="wrap">
    <span class="nav-sec-label">专题</span>
    <a href="/fun-lab" class="{{ 'active' if nav_path == '/fun-lab' else '' }}">趣味数据</a>
    <a href="/utility-lab" class="{{ 'active' if nav_path == '/utility-lab' else '' }}">道具专题</a>
    <a href="/map-analysis" class="{{ 'active' if nav_path == '/map-analysis' else '' }}">地图分析</a>
    <a href="/teams" class="{{ 'active' if nav_path == '/teams' else '' }}">队伍视图</a>
    <a href="/favorites" class="{{ 'active' if nav_path == '/favorites' else '' }}">收藏</a>
    <a href="/reports" class="{{ 'active' if nav_path == '/reports' else '' }}">报告</a>
  </div>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/js/common.js?v={{ static_v }}"></script>
<script src="/static/app.js?v={{ static_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
