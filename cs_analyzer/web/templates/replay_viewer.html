{% extends "base.html" %}
{% block title %}2D 回放 · {{ demo.map_name }}{% endblock %}
{% block body_class %}wide{% endblock %}
{% block content %}
<div class="sub"><a href="/match/{{ demo.hash }}">← 返回对局</a><span id="load-status"> · 加载回放数据…</span></div>

<div class="ob-layout" id="ob-root" hidden>
  <aside class="ob-team ob-team--t">
    <div class="ob-team-head"><span class="ob-side-name t-text">T</span><span class="ob-score t-text" id="score-t">0</span></div>
    <ul class="ob-rows" id="panel-t"></ul>
  </aside>

  <section class="ob-center">
    <div class="ob-scoreboard">
      <span class="ob-round-label" id="round-label">回合 -</span>
      <span class="ob-timer" id="round-timer">1:55</span>
      <span class="ob-bomb" id="bomb-timer" hidden></span>
      <div class="round-strip" id="round-strip" hidden></div>
    </div>
    <div class="ob-map-wrap">
      <canvas id="map-layer"></canvas>
      <canvas id="fx-layer"></canvas>
      <canvas id="main-layer"></canvas>
      <ul class="kill-feed" id="kill-feed"></ul>
      <div class="buy-strip" id="buy-strip" hidden></div>
      <!-- overlap mode: half toggles + phase slider (hidden in replay mode) -->
      <div class="ov-phase-bar" id="ov-phase-bar" hidden>
        <button class="chip on" id="ov-half-1" type="button">上半场</button>
        <button class="chip" id="ov-half-2" type="button">下半场</button>
        <span class="ovp-label">相位</span>
        <input type="range" id="ov-phase" min="0" max="1150" value="150">
        <span class="ovp-phase-val" id="ov-phase-val">0:15</span>
      </div>
      <div class="ob-toolbar" id="ob-toolbar">
        <button class="chip" id="prefs-btn" type="button" title="视觉参数调节面板">⚙ 调节</button>
      </div>
    </div>
    <div class="tl-wrap" id="tl-wrap">
      <canvas id="tl-canvas"></canvas>
      <div class="tl-tip" id="tl-tip"></div>
    </div>
    <div class="viewer-controls">
      <button class="btn btn-ghost" id="btn-play">播放</button>
      <select id="sel-speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
        <option value="4">4×</option>
        <option value="5">5×</option>
        <option value="6">6×</option>
        <option value="7">7×</option>
        <option value="8">8×</option>
      </select>
      <select id="sel-round"><option value="">跳转到回合…</option></select>
      <button class="btn btn-ghost" id="btn-cam-reset">复位视图</button>
      <span class="sub" id="cur-tick"></span>
    </div>
  </section>

  <aside class="ob-team ob-team--ct">
    <div class="ob-team-head"><span class="ob-score ct-text" id="score-ct">0</span><span class="ob-side-name ct-text">CT</span></div>
    <ul class="ob-rows" id="panel-ct"></ul>
  </aside>
</div>

<div class="card" id="load-error" hidden>
  <h2>加载失败</h2>
  <div class="sub" id="load-error-msg"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/weapon_meta.js?v={{ static_v }}"></script>
<script src="/static/js/viewer_prefs.js?v={{ static_v }}"></script>
<script src="/static/js/viewer_camera.js?v={{ static_v }}"></script>
<script src="/static/js/viewer_control.js?v={{ static_v }}"></script>
<script src="/static/js/viewer_overlays.js?v={{ static_v }}"></script>
<script src="/static/viewer_canvas.js?v={{ static_v }}"></script>
{% endblock %}
