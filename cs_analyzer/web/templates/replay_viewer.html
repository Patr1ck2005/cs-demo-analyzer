{% extends "base.html" %}
{% block title %}2D 回放 · {{ demo.map_name }}{% endblock %}
{% block content %}
<div class="sub"><a href="/demo/{{ demo.hash }}">← 返回 demo</a><span id="load-status"> · 加载回放数据…</span></div>

<div class="ob-layout" id="ob-root" hidden>
  <aside class="ob-team ob-team--t">
    <div class="ob-team-head"><span class="ob-side-name t-text">T</span><span class="ob-score t-text" id="score-t">0</span></div>
    <ul class="ob-rows" id="panel-t"></ul>
  </aside>

  <section class="ob-center">
    <div class="ob-scoreboard">
      <span class="ob-round-label" id="round-label">回合 -</span>
      <span class="ob-timer" id="round-timer">1:55</span>
      <div class="round-strip" id="round-strip" hidden></div>
    </div>
    <div class="ob-map-wrap">
      <canvas id="map-layer"></canvas>
      <canvas id="fx-layer"></canvas>
      <canvas id="main-layer"></canvas>
    </div>
    <div class="tl-wrap">
      <canvas id="tl-canvas"></canvas>
      <div class="tl-tip" id="tl-tip"></div>
    </div>
    <div class="viewer-controls">
      <button class="btn btn-ghost" id="btn-play">播放</button>
      <select id="sel-speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
      <select id="sel-round"><option value="">跳转到回合…</option></select>
      <span class="sub" id="cur-tick"></span>
      <a class="sub" href="/studio/replay/{{ demo.hash }}">导出视频 → 工作室</a>
    </div>
  </section>

  <aside class="ob-team ob-team--ct">
    <div class="ob-team-head"><span class="ob-score ct-text" id="score-ct">0</span><span class="ob-side-name ct-text">CT</span></div>
    <ul class="ob-rows" id="panel-ct"></ul>
  </aside>
</div>

<div class="card" id="load-error" hidden>
  <h2>加载失败</h2>
  <div class="sub" id="load-error-msg"></div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/viewer_canvas.js"></script>{% endblock %}
