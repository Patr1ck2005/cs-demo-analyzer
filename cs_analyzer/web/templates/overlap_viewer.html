{% extends "base.html" %}
{% block title %}回合重叠 · {{ demo.map_name }}{% endblock %}
{% block content %}
<div class="sub"><a href="/demo/{{ demo.hash }}">← 返回 demo</a> · <a href="/demo/{{ demo.hash }}/viewer">实时回放</a><span id="load-status"> · 加载回放数据…</span></div>

<div class="ov-layout" id="ov-root" hidden>
  <!-- left: map canvas -->
  <section class="ov-map-col">
    <div class="ov-scoreboard">
      <span id="ov-half-tab-t" class="ov-half-tab t-text">上半场</span>
      <span class="ov-score-sub" id="ov-half-score"></span>
      <span id="ov-half-tab-ct" class="ov-half-tab ct-text">下半场</span>
    </div>
    <div class="ov-map-wrap" id="ov-map-wrap">
      <canvas id="map-layer"></canvas>
      <canvas id="fx-layer"></canvas>
      <canvas id="main-layer"></canvas>
      <div class="ov-toolbar" id="ov-toolbar">
        <button class="chip on" id="ov-chip-trails">轨迹</button>
        <button class="chip" id="ov-chip-ghost">其他选手半透明</button>
      </div>
    </div>
    <div class="ov-controls">
      <span class="ovp-label">对比时刻</span>
      <input type="range" id="ov-phase" min="0" max="1150" value="150">
      <span class="ovp-phase-val" id="ov-phase-val">0:15</span>
      <span class="ovp-label" style="margin-left:10px">视角</span>
      <select id="ov-zoom">
        <option value="1">全场</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="ov-reset">复位</button>
    </div>
  </section>

  <!-- right: control panel -->
  <aside class="ov-side-col">
    <div class="ov-block">
      <div class="ov-block-title">回合 <span class="sub" id="ov-round-count"></span></div>
      <div class="ov-round-grid" id="ov-rounds"></div>
    </div>
    <div class="ov-block">
      <div class="ov-block-title">选手 <span class="sub">点击单独查看 · 再点取消</span></div>
      <div class="ov-player-grid" id="ov-players"></div>
    </div>
    <div class="ov-block">
      <div class="ov-block-title">图例</div>
      <div class="ov-legend sub">
        暖色 = 该回合 T 方 · 冷色 = 该回合 CT 方<br>编号 = 选手身份（跨回合不变）
      </div>
    </div>
    <div class="ov-block">
      <div class="ov-block-title">快捷</div>
      <div class="ov-quick">
        <button class="chip" id="ov-sel-all">全选回合</button>
        <button class="chip" id="ov-sel-none">清空</button>
        <button class="chip" id="ov-sel-first4">前 4 回合</button>
      </div>
    </div>
  </aside>
</div>

<div class="card" id="load-error" hidden>
  <h2>加载失败</h2>
  <div class="sub" id="load-error-msg"></div>
</div>
{% endblock %}
{% block scripts %}
<link rel="stylesheet" href="/static/overlap.css">
<script src="/static/js/weapon_meta.js"></script>
<script src="/static/js/viewer_camera.js"></script>
<script src="/static/viewer_overlap.js"></script>
{% endblock %}
