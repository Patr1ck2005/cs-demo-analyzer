# de_anubis radar map coordinate calibration (Phase N, K4 flow).
# Image: official CS2 overview radar (de_anubis_radar_psd.png, 1024x1024 RGBA),
# sourced from MurkyYT/cs2-map-icons via the GitHub contents API.
# Bounds from the game's official radar_info metadata:
#   pos_x=-2796, pos_y=3328, scale=5.22
# Standard Source mapping px=(x-pos_x)/scale, py=(pos_y-y)/scale is exactly
# equivalent to the loader's bounds formula with:
#   min_x=pos_x, max_x=pos_x+scale*W, max_y=pos_y, min_y=pos_y-scale*H

map_name: de_anubis
image_width: 1024
image_height: 1024
bounds:
  min_x: -2796.0
  max_x: 2548.8
  min_y: -2020.8
  max_y: 3328.0
