# Content-production config (channel A): full radar video with background + music.
# Usage: csa run <demo.dem> --config configs/content_prod.yaml
#   or reuse an existing radar render: csa export <demo> --format video \
#       --input output/<stem>/media/videos/1080p60/radar_chart.mov --config configs/content_prod.yaml
render:
  radar_chart:
    title: "2026 CS2 对局"
    subtitle: "WMPVP de_ancient"

export:
  video:
    background: bg/halloween_shadows_in_window.mp4
    music: "music/Michael Jackson - Thriller.mp3"
    use_nvenc: true
    fps: 60
