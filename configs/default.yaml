# CsDemoAnalyzer default configuration
# Copy this file and customize for your use case.

parser:
  provider: null  # null = auto-detect (faceit/valve/perfect_world/...)
  tick_rate: 64
  include_warmup: false

analysis:
  enabled_modules:
    - basic_stats
    - ratings

render:
  output_dir: output
  radar_chart:
    title: ""
    subtitle: ""
    attributes:
      - KPR
      - Survivals
      - ADR
      - Headshot%
      - FirstKillsPerRound
      - Rating Pro
    attribute_ranges:
      KPR: [0.5, 0.9]
      Survivals: [0.2, 0.35]
      ADR: [50.0, 90.0]
      Headshot%: [30.0, 50.0]
      FirstKillsPerRound: [0.0, 0.15]
      RWS: [6.0, 10.0]
      Rating: [0.7, 1.3]
      Rating Pro: [0.7, 1.2]
    style:
      highlight_color: "#FFD700"
      normal_color: "#FFFFFF"
      background_color: "#1A1A1A"
      radar_size: 2.4
      global_opacity: 0.5
    timing:
      show_title: 3.0
      show_ticks_def: 12.0
      show_ticks_max: 20.0
      show_ticks_min: 29.0
      end_intro: 38.0
      end_show: 93.0
      entry_times: null  # null = auto-distribute by player count
    assets:
      player_images_dir: radar_data
      default_image: radar_data/default.jpg

export:
  video:
    background: null
    music: null
    use_nvenc: true
    brightness: -0.05
    contrast: 1.0
    fps: 60
  image:
    format: png
    dpi: 150
  report:
    format: html

cache_dir: .cache
log_level: INFO
