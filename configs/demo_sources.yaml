# Platform demo source directories (Phase Y 2026-09-07).
#
# Each entry is a platform's default download directory. The import script
# (scripts/platform_import.py) scans these for *.zip packages, extracts the
# inner .dem, dedupes by content hash against demos/, and copies new demos
# in. Future work: a /system "扫描平台目录" button reusing the same module.
#
# Notes:
# - 5E zips in this install were observed truncated (EOCD missing) — the
#   importer skips unreadable zips and reports them instead of failing.
# - Zip containers never hash-equal their inner demo (compression); dedupe
#   must hash the INNER .dem stream (Y1 lesson).

